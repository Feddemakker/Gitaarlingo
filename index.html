<!DOCTYPE html>
<html lang="nl">
<head>
  <!-- Basisinstellingen: tekenset en schaal voor tablets -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Gitaarlingo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== SCHERM 1: de kaart met het kronkelpad ===== -->
  <section id="kaart" class="scherm actief">
    <header class="balk">
      <h1>🎸 Gitaarlingo</h1>
      <div class="sterren">⭐ <span id="aantal-sterren">0</span></div>
    </header>

    <div class="wereld">
      <!-- Het kronkelpad, getekend als SVG-lijn -->
      <svg class="pad" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M 20 82 C 45 82, 70 75, 72 58 S 30 40, 30 26 S 60 12, 80 16"
              fill="none" stroke="#f3d9a4" stroke-width="5" stroke-linecap="round"/>
        <path d="M 20 82 C 45 82, 70 75, 72 58 S 30 40, 30 26 S 60 12, 80 16"
              fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="2 3"
              stroke-linecap="round"/>
      </svg>

      <!-- De drie eilanden. data-eiland = het nummer (0, 1, 2) -->
      <button class="eiland" data-eiland="0" style="left:20%; top:82%">
        <span class="plaatje">🌈</span>
        <span class="naam">Regenboog&shy;snaren</span>
      </button>
      <button class="eiland" data-eiland="1" style="left:72%; top:58%">
        <span class="plaatje">🌴</span>
        <span class="naam">Palm&shy;ritme</span>
      </button>
      <button class="eiland" data-eiland="2" style="left:30%; top:26%">
        <span class="plaatje">🏰</span>
        <span class="naam">Akkoord&shy;kasteel</span>
      </button>

      <!-- Het poppetje dat over het pad loopt -->
      <div id="poppetje">🧒</div>
    </div>

    <button id="opnieuw" class="klein-knop" title="Opnieuw beginnen">↺</button>
  </section>

  <!-- ===== SCHERM 2: eiland Regenboogsnaren ===== -->
  <section id="regenboog" class="scherm">
    <header class="balk">
      <button class="terug-knop">⬅</button>
      <h2>🌈</h2>
      <!-- Drie bolletjes: hoeveel opdrachtjes je al goed hebt -->
      <div class="voortgang">
        <span class="bol"></span><span class="bol"></span><span class="bol"></span>
      </div>
    </header>

    <!-- De opdracht: een gekleurde stip + knop om de toon te horen -->
    <div class="opdracht">
      <span>Tik op</span>
      <span id="doel-stip" class="doel-stip"></span>
      <button id="luister" class="luister-knop" title="Luister">👂</button>
    </div>

    <!-- Hier zet script.js de 6 snaren neer -->
    <div id="snaren" class="snaren"></div>
  </section>

  <!-- ===== SCHERM 3: eiland Palmritme ===== -->
  <section id="palm" class="scherm">
    <header class="balk">
      <button class="terug-knop">⬅</button>
      <h2>🌴</h2>
      <div class="voortgang">
        <span class="bol"></span><span class="bol"></span><span class="bol"></span>
      </div>
    </header>

    <!-- Luisterknop: speel het ritme nog een keer -->
    <div class="opdracht">
      <button id="palm-luister" class="luister-knop" title="Luister">👂</button>
    </div>

    <!-- Hier zet script.js de kokosnoten neer (1 kokosnoot = 1 tokkel) -->
    <div id="kokosnoten" class="kokosnoten"></div>

    <!-- De grote tokkelknop -->
    <div class="midden">
      <button id="tokkel" class="tokkel-knop">🎸</button>
    </div>
  </section>

  <!-- ===== SCHERM 4: eiland Akkoordkasteel ===== -->
  <section id="kasteel" class="scherm">
    <header class="balk">
      <button class="terug-knop">⬅</button>
      <h2>🏰</h2>
      <div class="voortgang">
        <span class="bol"></span><span class="bol"></span><span class="bol"></span>
      </div>
    </header>

    <div class="opdracht">
      <button id="kasteel-luister" class="luister-knop" title="Luister">👂</button>
    </div>

    <!-- Twee keuzes: klinkt het akkoord blij of verdrietig? -->
    <div class="keuzes">
      <button class="keuze" data-soort="blij">😊<small>E</small></button>
      <button class="keuze" data-soort="sip">😢<small>Em</small></button>
    </div>
  </section>

  <!-- ===== Feestje als je een ster verdient ===== -->
  <div id="feest" class="feest verborgen">
    <div class="feest-ster">⭐</div>
    <p>Super!</p>
    <button id="verder" class="grote-knop">➜</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
