<!DOCTYPE html>
<html lang="nl">
<head>
  <!-- Basisinstellingen: tekenset en schaal voor tablets -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Gitaarlingo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== SCHERM 1: de kaart met het kronkelpad ===== -->
  <section id="kaart" class="scherm actief">
    <header class="balk">
      <!-- Elke letter in een eigen <span>, zo krijgt elke letter een eigen kleur -->
      <h1 class="titel">🎸 <span>G</span><span>i</span><span>t</span><span>a</span><span>a</span><span>r</span><span>l</span><span>i</span><span>n</span><span>g</span><span>o</span></h1>
      <div class="sterren">⭐ <span id="aantal-sterren">0</span></div>
    </header>

    <div class="wereld">
      <!-- Het kronkelpad, getekend als SVG-lijn -->
      <svg class="pad" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M 14 82 C 28 88, 38 76, 46 74 S 76 66, 80 52 S 62 36, 50 35 S 20 32, 18 18"
              fill="none" stroke="#ffb300" stroke-width="5" stroke-linecap="round"/>
        <path d="M 14 82 C 28 88, 38 76, 46 74 S 76 66, 80 52 S 62 36, 50 35 S 20 32, 18 18"
              fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="2 3"
              stroke-linecap="round"/>
      </svg>

      <!-- De eilanden. data-eiland = het nummer (0 t/m 4) -->
      <button class="eiland" data-eiland="0" style="left:14%; top:82%">
        <span class="plaatje">🔧</span>
        <span class="naam">Stemhut</span>
      </button>
      <button class="eiland" data-eiland="1" style="left:46%; top:74%">
        <span class="plaatje">🌈</span>
        <span class="naam">Regenboog&shy;snaren</span>
      </button>
      <button class="eiland" data-eiland="2" style="left:80%; top:52%">
        <span class="plaatje">🌴</span>
        <span class="naam">Palm&shy;ritme</span>
      </button>
      <button class="eiland" data-eiland="3" style="left:50%; top:35%">
        <span class="plaatje">🏰</span>
        <span class="naam">Akkoord&shy;kasteel</span>
      </button>
      <button class="eiland" data-eiland="4" style="left:18%; top:18%">
        <span class="plaatje">🎵</span>
        <span class="naam">Liedjes&shy;strand</span>
      </button>

      <!-- Het poppetje dat over het pad loopt -->
      <div id="poppetje">🧒</div>
    </div>

    <button id="opnieuw" class="klein-knop" title="Opnieuw beginnen">↺</button>
  </section>

  <!-- ===== SCHERM 2: eiland Stemhut (gitaar stemmen) ===== -->
  <section id="stemhut" class="scherm">
    <header class="balk">
      <button class="terug-knop">⬅<kbd class="toets">Esc</kbd></button>
      <h2>🔧</h2>
      <!-- Welke gitaren zijn al gestemd? -->
      <div class="gitaren">
        <span class="gitaar-badge">🧑🎸</span><span class="gitaar-badge">👧🎸</span>
      </div>
    </header>

    <!-- Wiens gitaar is nu aan de beurt -->
    <div class="beurt"></div>

    <!-- De 6 snaren als rondjes; script.js vult ze in -->
    <div id="stem-snaren" class="stem-snaren"></div>

    <!-- De stemmeter: links te laag, midden goed, rechts te hoog -->
    <div class="meter">
      <span class="meter-kant">⬆️</span>
      <div class="meter-baan">
        <div class="meter-goed"></div>
        <div id="naald" class="naald"></div>
      </div>
      <span class="meter-kant">⬇️</span>
    </div>
    <div id="stem-hint" class="stem-hint">🎸</div>

    <div class="stem-knoppen">
      <button class="luister-knop" title="Zo moet het klinken">🔊<kbd class="toets">Enter</kbd></button>
      <span class="mic-meter" title="Zo hard hoort de microfoon je">🎤<span class="mic-balk"><span class="mic-vulling"></span></span></span>
      <button id="stem-overslaan" class="klein-rond" title="Deze snaar overslaan">⏭</button>
    </div>
  </section>

  <!-- ===== SCHERM 3: eiland Regenboogsnaren (echte gitaar) ===== -->
  <section id="regenboog" class="scherm">
    <header class="balk">
      <button class="terug-knop">⬅<kbd class="toets">Esc</kbd></button>
      <h2>🌈</h2>
      <!-- Bolletjes: hoeveel opdrachtjes je al goed hebt (script.js maakt ze) -->
      <div class="voortgang"></div>
    </header>

    <div class="beurt"></div>

    <!-- De opdracht: speel de snaar met deze kleur op je gitaar -->
    <div class="opdracht">
      <span>🎸</span>
      <span id="doel-stip" class="doel-stip"></span>
      <button class="luister-knop" title="Zo klinkt het">🔊<kbd class="toets">Enter</kbd></button>
      <span class="mic-meter" title="Zo hard hoort de microfoon je">🎤<span class="mic-balk"><span class="mic-vulling"></span></span></span>
    </div>

    <!-- Hier zet script.js de 6 snaren neer -->
    <div id="snaren" class="snaren"></div>
  </section>

  <!-- ===== SCHERM 4: eiland Palmritme ===== -->
  <section id="palm" class="scherm">
    <header class="balk">
      <button class="terug-knop">⬅<kbd class="toets">Esc</kbd></button>
      <h2>🌴</h2>
      <div class="voortgang"></div>
    </header>

    <!-- Luisterknop: speel het ritme nog een keer -->
    <div class="opdracht">
      <button class="luister-knop" title="Luister">👂<kbd class="toets">Enter</kbd></button>
    </div>

    <!-- Hier zet script.js de kokosnoten neer (1 kokosnoot = 1 tokkel) -->
    <div id="kokosnoten" class="kokosnoten"></div>

    <!-- De grote tokkelknop -->
    <div class="midden">
      <button id="tokkel" class="tokkel-knop">🎸<kbd class="toets">spatie</kbd></button>
    </div>
  </section>

  <!-- ===== SCHERM 5: eiland Akkoordkasteel ===== -->
  <section id="kasteel" class="scherm">
    <header class="balk">
      <button class="terug-knop">⬅<kbd class="toets">Esc</kbd></button>
      <h2>🏰</h2>
      <div class="voortgang"></div>
    </header>

    <div class="opdracht">
      <button class="luister-knop" title="Luister">👂<kbd class="toets">Enter</kbd></button>
    </div>

    <!-- Twee keuzes: klinkt het akkoord blij of verdrietig? -->
    <div class="keuzes">
      <button class="keuze" data-soort="blij">😊<small>E</small><kbd class="toets">←</kbd></button>
      <button class="keuze" data-soort="sip">😢<small>Em</small><kbd class="toets">→</kbd></button>
    </div>
  </section>

  <!-- ===== Feestje als je een ster verdient ===== -->
  <div id="feest" class="feest verborgen">
    <div class="feest-ster">⭐</div>
    <p>Super!</p>
    <button id="verder" class="grote-knop">➜<kbd class="toets">Enter</kbd></button>
  </div>

  <!-- ===== Melding als de microfoon niet mag of niet werkt ===== -->
  <div id="mic-fout" class="feest verborgen">
    <div class="feest-ster">🎤❓</div>
    <p class="mic-uitleg">De app kan je niet horen.<br>
      Klik bovenin naast het adres op het 🔒 of 🎤-icoontje<br>
      en kies <b>Microfoon: toestaan</b>. Probeer het daarna opnieuw.</p>
    <button id="mic-terug" class="grote-knop">⬅</button>
  </div>

  <script src="microfoon.js"></script>
  <script src="script.js"></script>
</body>
</html>
